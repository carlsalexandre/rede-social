<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede Social - Login</title>

    <link rel="stylesheet" type="text/css" href="/assets/css/login.css"> 
</head>
<body>
    <div class="container-login">
        <div>
            <form class="redesocial-form" id="login">
                <span>Seja bem vindo(a) a rede social</span>
                <div>
                    <input type="text" name="email" id="email" placeholder="Digite o seu e-mail" required="required">
                </div>
                <div>
                    <input type="password" name="senha" id="senha" placeholder="Digite a sua senha" required="required">
                </div>
                <a href="#"> Criar uma nova conta </a>
                <button type="submit" class="btn-redesocial">Login</button>
            </form>
        </div>
    </div>   
</body>
</html>
